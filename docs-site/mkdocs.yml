site_name: hyperproc
site_description: Multi-sensor hyperspectral processing for terrestrial ecosystem research.
docs_dir: docs
site_dir: site
use_directory_urls: true
theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  logo: assets/logos/wordmark.svg
  favicon: assets/logos/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
  - scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.indexes
  - navigation.top
  - navigation.footer
  - search.suggest
  - search.highlight
  - content.code.copy
plugins:
- search
- mkdocstrings:
    handlers:
      python:
        paths:
        - /data/fujiang/Hyperspectral_data_processing
        options:
          allow_inspection: false
          docstring_style: google
          docstring_section_style: spacy
          docstring_options:
            warn_unknown_params: false
            warn_missing_types: false
          show_source: true
          show_signature_annotations: true
          signature_crossrefs: false
          show_symbol_type_heading: true
          heading_level: 2
          show_submodules: false
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- toc:
    permalink: true
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.tabbed:
    alternate_style: true
extra_css:
- assets/vendor/leaflet/leaflet.css
- stylesheets/extra.css
extra:
  generator: false
copyright: hyperproc 0.1.2 · MIT · Fujiang Ji
